name: Checks and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Data is up to date
        run: |
          node tools/build-data.js
          git diff --exit-code -- app/data gear.csv || (echo "Run node tools/build-data.js and commit app/data and gear.csv" && exit 1)
      - run: node test/run.js

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build one self-contained file per page
        run: |
          node tools/build-single.js
          mkdir -p _site
          cp dist/gear-library.html _site/index.html
          cp dist/mounts.html _site/mounts.html
          cp -r mounts _site/mounts
          cp gear.csv _site/gear.csv
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
