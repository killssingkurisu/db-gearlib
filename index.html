<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DB Gear Library</title>
<meta name="description" content="Every gear item in Dungeon Blitz in one table: class, type, rarity, focus, stats, runes, skill rune and magic.">
<link rel="stylesheet" href="app/gearlib.css">
</head>
<body>
<div class="page" id="page">
  <header class="top">
    <nav class="tabs" aria-label="Library">
      <a class="tab on" href="./" aria-current="page">Gears</a>
      <span class="tabsep" aria-hidden="true"></span>
      <a class="tab" href="mounts.html">Mounts</a>
    </nav>
    <p class="sub" id="summary">Loading the game's gear list…</p>
  </header>

  <section class="panel results" aria-label="Gear">
    <div class="searchrow">
      <label class="visually-hidden" for="q">Search gear by name</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search by name…  (press / to jump here)">
    </div>
    <div class="filterbar" id="filterbar"></div>
    <div class="head reshead">
      <span class="sub" id="count"></span>
      <button class="linkbtn" id="clearAll" type="button" hidden>Clear filters</button>
      <button class="linkbtn" id="sortReset" type="button" hidden>Default order</button>
      <span class="spacer"></span>
      <button class="btn" id="copyCsv" type="button" title="Copy every matching row as CSV, to paste into a spreadsheet">Copy CSV</button>
      <button class="btn primary" id="saveCsv" type="button" title="Save every matching row as a .csv file" hidden>Download CSV</button>
    </div>
    <div class="tablewrap" id="tablewrap">
      <table class="grid" id="grid">
        <thead><tr id="gridHead"></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <button class="btn more" id="more" type="button" hidden>Show more</button>
  </section>

  <footer class="foot">
    <span><span id="dataNote"></span> <a href="gear.csv">Whole library as gear.csv</a></span>
    <span>Item list from the game's Login.swz via DB Inventory Scanner. Stats as the game shows them, read from inventory scans. Drop locations from the server's drop rules. Part of the Dungeon Blitz R tools alongside the <a href="https://killssingkurisu.github.io/db-dps-calculator/">DPS Calculator</a>.</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app/data/gear-data.js"></script>
<script src="app/data/seed-scans.js"></script>
<script src="app/model.js"></script>
<script src="app/filters.js"></script>
<script src="app/gearlib.js"></script>
</body>
</html>
