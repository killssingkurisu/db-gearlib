<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DB Gear Library</title>
<meta name="description" content="Every gear item in Dungeon Blitz in one table, with what your characters own.">
<link rel="stylesheet" href="app/gearlib.css">
</head>
<body>
<div class="page" id="page">
  <header class="top">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <h1>Gear Library</h1>
      <p class="sub" id="summary">Loading the game's gear list…</p>
    </div>
    <div class="topactions">
      <label class="btn" for="importFile" title="Add DB Inventory Scanner files (dbb-inventory). You can also drop them on the page.">Import scans</label>
      <input type="file" id="importFile" accept=".json,application/json" multiple hidden>
    </div>
  </header>

  <section class="panel results" aria-label="Gear">
    <div class="filterbar" id="filterbar"></div>
    <div class="head reshead">
      <span class="sub" id="count"></span>
      <button class="linkbtn" id="clearAll" type="button" hidden>Clear filters</button>
      <button class="linkbtn" id="sortReset" type="button" hidden>Default order</button>
      <span class="spacer"></span>
      <button class="btn" id="copyCsv" type="button" title="Copy every matching row as CSV, to paste into a spreadsheet">Copy CSV</button>
      <button class="btn primary" id="saveCsv" type="button" title="Save every matching row as a .csv file" hidden>Download CSV</button>
    </div>
    <div class="tablewrap" id="tablewrap">
      <table class="grid" id="grid">
        <thead><tr id="gridHead"></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <button class="btn more" id="more" type="button" hidden>Show more</button>
  </section>

  <footer class="foot">
    <span id="dataNote"></span>
    <span>Item list from the game's Login.swz via DB Inventory Scanner. Stats come from scans. Part of the Dungeon Blitz R tools alongside the <a href="https://killssingkurisu.github.io/db-dps-calculator/">DPS Calculator</a>.</span>
  </footer>
</div>

<div class="drop" id="drop" hidden><div><b>Drop scans to import</b><span>DB Inventory Scanner files (dbb-inventory)</span></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="app/data/gear-data.js"></script>
<script src="app/data/seed-scans.js"></script>
<script src="app/model.js"></script>
<script src="app/filters.js"></script>
<script src="app/gearlib.js"></script>
</body>
</html>
